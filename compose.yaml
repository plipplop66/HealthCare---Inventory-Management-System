services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: medripple
      MYSQL_USER: medripple
      MYSQL_PASSWORD: medripple_dev_only
      MYSQL_ROOT_PASSWORD: root_dev_only
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/002_add_human_rejected_transfer_status.sql:/docker-entrypoint-initdb.d/02-add-rejected-status.sql:ro
      - ./database/golden-scenario.sql:/docker-entrypoint-initdb.d/03-golden-scenario.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3001
      DATA_SOURCE: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: medripple
      DATABASE_USER: medripple
      DATABASE_PASSWORD: medripple_dev_only
      SIMULATION_DATE: 2026-09-11
      INTELLIGENCE_SERVICE_URL: ""
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:

